<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <style>
    @font-face{font-family:'IT';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
    @font-face{font-family:'GM';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
    .mono{font-family:'GM',ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1.5px;fill:#8a8a8a}
    .big{font-family:'IT','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;font-size:136px;letter-spacing:-7px;fill:#ffffff}
    .fade{opacity:0;animation:in 1.2s ease forwards}
    .d2{animation-delay:.25s}.d3{animation-delay:.5s}
    .dot{animation:p 2.4s ease-in-out infinite}
    @keyframes in{to{opacity:1}}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.15}}
  </style>
  <g class="fade">
    <text x="0" y="22" class="mono">NAÏM KHROF ©2026</text>
    <text x="900" y="22" text-anchor="end" class="mono">(PORTFOLIO)</text>
  </g>
  <g class="fade d2">
    <text x="-4" y="190" class="big">Naïm</text>
    <text x="-4" y="305" class="big">Khrof<tspan fill="#8a8a8a">.</tspan></text>
  </g>
  <g class="fade d3">
    <line x1="0" y1="338" x2="900" y2="338" stroke="#8a8a8a" stroke-opacity=".35"/>
    <circle class="dot" cx="4" cy="363" r="3" fill="#ffffff"/>
    <text x="16" y="367" class="mono">DEVELOPER — AVAILABLE</text>
    <text x="878" y="367" text-anchor="end" class="mono">NAIMKHROF.COM</text>
    <path d="M888 369 L898 359 M890 359 L898 359 L898 367" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>
</svg>
